<!DOCTYPE html>
<html lang="ar" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oi | By Gee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body data-data-base="../data">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">Oi</div>
        <div class="brand-text">
          <div class="brand-title">
            <h1>Oi</h1>
            <span class="brand-sep">|</span>
            <span class="brand-sign">By Gee</span>
          </div>
          <p>Open Interest</p>
        </div>
      </div>
      <div class="meta">
        <div id="updatedAt">—</div>
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <div style="width:120px"></div>
        <div>
          <h2>المؤشرات</h2>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="reloadBtn" class="btn btn-primary" type="button">تحديث العرض</button>
          <button id="exportBtn" class="btn btn-teal" type="button">تصدير Excel</button>
          <button id="mapBtn" class="btn btn-map" type="button">Map</button>
        </div>
      </div>
      <div id="tickers" class="tickers"></div>
      <div class="controls">
        <div class="select">
          <label for="expSelect">الانتهاء</label>
          <select id="expSelect"></select>
        </div>
        <label>Days</label>
        <div id="daysRow" class="chip-row"></div>
        <label>Strikes</label>
        <div id="strikesRow" class="chip-row"></div>
        <button id="deltaBtn" class="delta-btn" type="button" title="التزايد">Δ</button>
      </div>
      <div class="panel">
        <div id="tableHost"></div>
        <div id="status" class="status"></div>
      </div>
    </main>
  </div>
  <div id="mapModal" class="map-modal hidden" role="dialog" aria-modal="true">
    <div class="map-panel">
      <div class="map-head">
        <div>
          <h3 id="mapTitle">Levels Map</h3>
          <p id="mapSub" class="map-sub">—</p>
        </div>
        <button id="mapClose" class="btn" type="button">إغلاق</button>
      </div>
      <div id="mapBody" class="map-body"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
