<!DOCTYPE html>
<html lang="ar" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>Oi | BY GEE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body data-data-base="../data">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">Oi</div>
        <span class="brand-divider brand-divider-light"></span>
        <div class="brand-left">
          <div class="brand-oi">Oi</div>
          <div class="brand-sub">Open Interest</div>
        </div>
        <span class="brand-sign">BY GEE</span>
      </div>
      <div class="meta">
        <div id="updatedAt">—</div>
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <div style="width:120px"></div>
        <div>
          <h2>المؤشرات</h2>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="exportBtn" class="btn btn-excel" type="button">Excel</button>
          <button id="mapBtn" class="btn btn-map" type="button">Map</button>
          <button id="archiveBtn" class="btn btn-archive" type="button" title="أرشيف الأسبوع">
            <svg class="arch-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M5 4h14a1 1 0 0 1 1 1v2.2a1 1 0 0 1-.4.8l-1.6 1.2V19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9.8L4.4 8A1 1 0 0 1 4 7.2V5a1 1 0 0 1 1-1zm1 2v.6l1.6 1.2A1 1 0 0 1 8 8.6V19h8V8.6a1 1 0 0 1 .4-.8L18 6.6V6H6zm3 5h6v2H9v-2zm0 4h6v2H9v-2z"/>
            </svg>
          </button>
          <button id="feedbackBtn" class="btn btn-feedback" type="button" title="تعليق خاص">💬</button>
        </div>
      </div>
      <div class="tickers-wrap">
        <div id="tickers" class="tickers"></div>
              </div>
      <div class="controls">
        <div class="select select-exp-series">
          <div class="exp-series-row">
            <button id="seriesBtn" class="series-btn" type="button" title="اليوم بالسابق">اليوم بالسابق</button>
            <label for="expSelect" class="exp-label">الانتهاء</label>
            <select id="expSelect"></select>
          </div>
        </div>
        <label>Days</label>
        <div id="daysRow" class="chip-row"></div>
        <label>Strikes</label>
        <div id="strikesRow" class="chip-row"></div>
        <button id="deltaBtn" class="delta-btn" type="button" title="التزايد">Δ</button>
        <div id="stocksRow" class="stocks-inline"></div>
        <button id="x3Btn" class="x3-btn" type="button" title="عرض ثلاثي">×3</button>
      </div>
      <div class="panel">
        <div id="tableHost"></div>
        <div id="status" class="status"></div>
      </div>
    </main>
  </div>
  <div id="mapModal" class="map-modal hidden" role="dialog" aria-modal="true">
    <div class="map-panel">
      <div class="map-head">
        <div>
          <h3 id="mapTitle">Levels Map</h3>
          <p id="mapSub" class="map-sub">—</p>
        </div>
        <button id="mapClose" class="btn" type="button">إغلاق</button>
      </div>
      <div id="mapBody" class="map-body"></div>
    </div>
  </div>
  <div id="exportModal" class="map-modal hidden" role="dialog" aria-modal="true">
    <div class="map-panel export-panel">
      <div class="map-head">
        <div>
          <h3>Excel</h3>
        </div>
        <button id="exportClose" class="btn" type="button">إغلاق</button>
      </div>
      <div id="exportBody" class="map-body export-body"></div>
    </div>
  </div>
  <div id="feedbackModal" class="map-modal hidden" role="dialog" aria-modal="true">
    <div class="map-panel feedback-panel">
      <div class="map-head">
        <div>
          <h3>تعليق خاص</h3>
          
        </div>
        <button id="feedbackClose" class="btn" type="button">إغلاق</button>
      </div>
      <form id="feedbackForm" class="feedback-form">
        <label>الاسم <span class="opt">(اختياري)</span></label>
        <input id="fbName" type="text" maxlength="80" placeholder="—" autocomplete="name" />
        <label>التعليق</label>
        <textarea id="fbMsg" rows="4" maxlength="2000" required placeholder="اكتب ملاحظتك…"></textarea>
        <p id="fbStatus" class="exp-status"></p>
        <div class="exp-export-actions">
          <button type="submit" class="btn btn-teal" id="fbSend">إرسال</button>
          <button type="button" class="btn" id="fbCancel">إلغاء</button>
        </div>
      </form>
    </div>
  </div>
    <div id="archiveModal" class="map-modal hidden" role="dialog" aria-modal="true">
    <div class="map-panel archive-panel archive-export-only">
      <button id="archiveClose" class="arch-close-x" type="button" aria-label="إغلاق">×</button>
      <div class="archive-head-center">
        <div class="arch-title-row">
          <svg class="arch-head-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M5 4h14a1 1 0 0 1 1 1v2.2a1 1 0 0 1-.4.8l-1.6 1.2V19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9.8L4.4 8A1 1 0 0 1 4 7.2V5a1 1 0 0 1 1-1zm1 2v.6l1.6 1.2A1 1 0 0 1 8 8.6V19h8V8.6a1 1 0 0 1 .4-.8L18 6.6V6H6zm3 5h6v2H9v-2zm0 4h6v2H9v-2z"/>
          </svg>
          <h3 id="archiveTitle">أرشيف الأسبوع</h3>
        </div>
        <p id="archiveSub" class="map-sub">اختر تاريخًا</p>
      </div>
      <div id="archDateRow" class="arch-date-row"></div>
      <div class="arch-select-hint" id="archSelectHint">حدّد يومًا أو أكثر للتصدير · اضغط الكل لتحديد الجميع</div>
      <div class="archive-toolbar archive-toolbar-center">
        <span class="arch-lab">Days</span>
        <div id="archDaysRow" class="chip-row"></div>
        <span class="arch-lab">Strikes</span>
        <div id="archStrikesRow" class="chip-row"></div>
        <button id="archDeltaBtn" class="delta-btn" type="button" title="التزايد">Δ</button>
      </div>
      <div class="archive-export-row">
        <select id="archExportMode" class="arch-select">
          <option value="multi">صفحات متعددة</option>
          <option value="single">صفحة واحدة</option>
        </select>
        <button id="archExportBtn" class="btn btn-excel" type="button">Excel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b3b1b9ffbbd74d1d902173c2f92ce3a7"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
