name: Update OCC Data Backup

# إزاحة 5 دقائق — نفس النافذة 4–8 ص السعودية فقط
on:
  schedule:
    - cron: "5-59/10 1-4 * * *"
    - cron: "5,15,25,35,45,55 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-occ-data-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install requests yfinance
      - name: Fetch OCC → JSON
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python scripts/fetch_occ.py
      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/ || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: OCC backup $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:${{ github.ref_name }}
          fi
