name: Update OCC Data Backup

# إزاحة 5 دقائق عن الأساسي — احتياط إذا تخطّى GitHub الـ cron
on:
  schedule:
    - cron: "5-59/10 1-4 * * *"
    - cron: "10,30,50 5 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-occ-data-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install requests yfinance
      - name: Show trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Fetch OCC
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python scripts/fetch_occ.py
      - name: Commit & push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/ || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: OCC backup $(date -u +%Y-%m-%dT%H:%MZ) [${{ github.event_name }}]"
            git push origin HEAD:${{ github.ref_name }}
          fi
