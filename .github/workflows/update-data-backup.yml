name: Update OCC Data Backup

# نفس النوافذ +5 دقائق | بدون تكرار 9:00 (الأساسي يكفي)
on:
  schedule:
    - cron: "45 1 * * *"   # 4:45
    - cron: "55 1 * * *"   # 4:55
    - cron: "5 2 * * *"    # 5:05
    - cron: "15 2 * * *"   # 5:15
    - cron: "25 2 * * *"   # 5:25
    - cron: "35 2 * * *"   # 5:35
    - cron: "45 2 * * *"   # 5:45
    - cron: "5 3 * * *"    # 6:05
    - cron: "25 3 * * *"   # 6:25
    - cron: "45 3 * * *"   # 6:45
    - cron: "5 4 * * *"    # 7:05
    - cron: "25 4 * * *"   # 7:25
    - cron: "45 4 * * *"   # 7:45
  workflow_dispatch: {}

concurrency:
  group: update-occ-data-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install requests yfinance
      - name: Fetch OCC
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/fetch_occ.py
      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data 2>/dev/null || git add data/ web/data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: OCC snapshot backup $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Pushed"
          fi
