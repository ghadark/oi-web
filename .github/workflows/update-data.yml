name: Update OCC Data

on:
  schedule:
    # توقيت السعودية UTC+3 — أبكر ما يمكن حول 7 صباحًا
    - cron: "0 4 * * 1-5"    # 7:00 ص — الإثنين–الجمعة
    - cron: "20 4 * * 1-5"   # 7:20 ص — إعادة محاولة إن تأخر OCC
    # الويكند: OCC غالبًا ينشر أرقام الاثنين من السبت
    - cron: "0 4 * * 6"      # 7:00 ص السبت
    - cron: "20 4 * * 6"     # 7:20 ص السبت
    - cron: "0 4 * * 0"      # 7:00 ص الأحد
    - cron: "20 4 * * 0"     # 7:20 ص الأحد
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Fetch OCC → JSON (data/ + web/data/)
        run: python scripts/fetch_occ.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: OCC snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
