name: Update OCC Data

on:
  schedule:
    # احتياطي واحد فقط: 9:00 صباحًا بتوقيت السعودية = 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-occ-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Fetch OCC → JSON
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/fetch_occ.py

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data 2>/dev/null || git add data/ web/data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: OCC snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Pushed"
          fi
