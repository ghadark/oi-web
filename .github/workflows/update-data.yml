name: Update OCC Data

# السعودية 4:40–5:40 كل 10د | 5:40–7:40 كل 20د | تشييك 9:00
# بدون 8 ص | UTC = سعودي − 3
on:
  schedule:
    # —— الساعة الأولى: 4:40–5:40 كل 10 د ——
    - cron: "40 1 * * *"   # 4:40
    - cron: "50 1 * * *"   # 4:50
    - cron: "0 2 * * *"    # 5:00
    - cron: "10 2 * * *"   # 5:10
    - cron: "20 2 * * *"   # 5:20
    - cron: "30 2 * * *"   # 5:30
    - cron: "40 2 * * *"   # 5:40
    # —— الساعة 2 و 3: 5:40–7:40 كل 20 د ——
    - cron: "0 3 * * *"    # 6:00
    - cron: "20 3 * * *"   # 6:20
    - cron: "40 3 * * *"   # 6:40
    - cron: "0 4 * * *"    # 7:00
    - cron: "20 4 * * *"   # 7:20
    - cron: "40 4 * * *"   # 7:40
    # —— تشييك واحد 9:00 ——
    - cron: "0 6 * * *"    # 9:00
  workflow_dispatch: {}

concurrency:
  group: update-occ-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Fetch OCC → JSON
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/fetch_occ.py

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data 2>/dev/null || git add data/ web/data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: OCC snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Pushed"
          fi
