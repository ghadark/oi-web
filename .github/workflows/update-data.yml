name: Update OCC Data

# السعودية 4:00–8:00 ص = UTC 01:00–05:00
# كل 10 دقائق؛ السكربت يتوقف تلقائيًا بعد التقاط تحديث اليوم
on:
  schedule:
    - cron: "*/10 1-4 * * *"
    - cron: "0,10,20,30,40,50 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-occ-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Show trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%MZ)"
          echo "riyadh=$(TZ=Asia/Riyadh date +%Y-%m-%dT%H:%M)"

      - name: Fetch OCC → JSON
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python scripts/fetch_occ.py

      - name: Commit & push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/ || true
          if git diff --staged --quiet; then
            echo "No data changes — stop (expected after morning capture)"
          else
            git commit -m "data: OCC snapshot $(date -u +%Y-%m-%dT%H:%MZ) [${{ github.event_name }}]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed OK"
          fi
