name: Update OCC Data

on:
  schedule:
    # السعودية UTC+3
    # السبت: سحب أرقام الاثنين من OCC وعمود 17-8 (مثلاً)
    # الأحد/الإثنين: تشييك واستبدال إن تغيّر الرقم
    # الثلاثاء–الجمعة: تحديث يوم بيوم
    - cron: "30 3 * * *"   # 6:30 ص كل يوم
    - cron: "0 4 * * *"    # 7:00 ص كل يوم
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Fetch OCC → JSON (data/ + web/data/)
        run: python scripts/fetch_occ.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: OCC snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
